<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Course Registration | Demo Learning Portal</title><style>
body{font-family:sans-serif}.notice{color:#333;background:#fff}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #005fcc;outline-offset:2px}
button,a{display:inline-block;min-height:24px;min-width:24px;padding:4px}form{display:grid;gap:.5rem;max-width:24rem}
</style></head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header><img src="logo.png" alt="Demo Learning Portal"><nav aria-label="Primary"><button type="button" id="menu">Menu</button></nav></header>
<main id="main">
<h1>Course registration</h1>
<p class="notice">Registration closes Friday.</p>
<form>
  <label for="name">Full name</label> <input type="text" id="name" autocomplete="name">
  <label for="email">Email</label> <input type="email" id="email" autocomplete="email">
  <label for="course">Course</label> <select id="course"><option>Section 508 Basics</option></select>
  <a href="/privacy.html">Privacy policy</a>
  <button type="submit" id="submit">Register</button>
</form>
<a href="/catalog.html">Browse the course catalog</a>
</main>
</body>
</html>
